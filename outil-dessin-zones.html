```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Outil Dessin Zones</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h2{
margin:20px;
}

#zone{
position:relative;
width:720px;
margin:auto;
border:2px solid #444;
}

#zone img{
width:720px;
height:auto;
display:block;
}

.selection{
position:absolute;
border:2px solid cyan;
background:rgba(0,255,255,0.3);
}

#result{
margin-top:20px;
width:600px;
height:160px;
font-size:14px;
}

</style>
</head>

<body>

<h2>Outil placement boutons</h2>

<p>Glisse la souris sur l'image pour créer une zone.</p>

<div id="zone">

<img src="background.jpg" id="image">

</div>

<textarea id="result" placeholder="Le CSS apparaîtra ici"></textarea>

<script>

const zone = document.getElementById("zone");

let startX = 0;
let startY = 0;
let box = null;

zone.addEventListener("mousedown",function(e){

startX = e.offsetX;
startY = e.offsetY;

box = document.createElement("div");
box.className = "selection";

box.style.left = startX + "px";
box.style.top = startY + "px";

zone.appendChild(box);

zone.addEventListener("mousemove",draw);

});

function draw(e){

let width = e.offsetX - startX;
let height = e.offsetY - startY;

box.style.width = width + "px";
box.style.height = height + "px";

}

zone.addEventListener("mouseup",function(e){

zone.removeEventListener("mousemove",draw);

let css = 
"top:" + startY + "px;\n" +
"left:" + startX + "px;\n" +
"width:" + box.offsetWidth + "px;\n" +
"height:" + box.offsetHeight + "px;";

document.getElementById("result").value = css;

});

</script>

</body>
</html>
```
