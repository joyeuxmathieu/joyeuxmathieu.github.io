<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Evénements Alphark</title>

<link rel="stylesheet" href="../style.css">

</head>

<body class="events-page">

<h1 class="title">ÉVÉNEMENTS ALPHARK</h1>

<div class="events-list">

<div class="event" onclick="openEvent('course')">COURSE DINO</div>
<div class="event" onclick="openEvent('glace')">PALAIS DES GLACE</div>
<div class="event" onclick="openEvent('rallye')">ARK RALLYE</div>
<div class="event" onclick="openEvent('peche')">PECHE</div>
<div class="event" onclick="openEvent('chaise')">CHAISE MUSICAL</div>
<div class="event" onclick="openEvent('gnome')">GNOME</div>
<div class="event" onclick="openEvent('tresor')">CHASSE AU TRESOR</div>
<div class="event" onclick="openEvent('quidditch')">COUPE DE QUIDDITCH</div>
<div class="event" onclick="openEvent('combat')">PARCOURS DU COMBATTANT</div>
<div class="event" onclick="openEvent('total')">TOTAL WAR</div>
<div class="event" onclick="openEvent('ile')">JEUX DE L ILE</div>
<div class="event" onclick="openEvent('tir')">TIR A L'ARC</div>

</div>


<!-- POPUP EVENT -->

<div class="popup" id="popup">

<div class="event-card" id="card">

<span class="close" onclick="closeEvent()">✖</span>

<h2 id="event-title"></h2>

<p id="event-desc"></p>

</div>

</div>


<script>

function openEvent(name){

document.getElementById("popup").style.display="flex"

let title=""
let desc=""

switch(name){

case "course":
title="COURSE DINO"
desc="Course de dinos dans une arène. Le premier arrivé gagne."
break

case "glace":
title="PALAIS DES GLACE"
desc="Labyrinthe glacé rempli de pièges."
break

case "rallye":
title="ARK RALLYE"
desc="Course à travers la map avec checkpoints."
break

case "peche":
title="PECHE"
desc="Concours de pêche. Le plus gros poisson gagne."
break

default:
title="EVENT"
desc="Description à ajouter."
}

document.getElementById("event-title").innerText=title
document.getElementById("event-desc").innerText=desc

}

function closeEvent(){
document.getElementById("popup").style.display="none"
}

</script>

</body>
</html>
