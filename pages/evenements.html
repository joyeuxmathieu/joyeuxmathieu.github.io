
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Événements Alphark</title>

<style>

/* fond */

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
text-align:center;
}

/* titre */

h1{
margin-top:40px;
color:#00eaff;
text-shadow:0 0 15px #00eaff;
}

/* liste */

.events{

width:600px;
margin:auto;
margin-top:40px;

}

/* bouton event */

.event{

background:#111;

padding:12px;

margin:6px;

border:1px solid #444;

cursor:pointer;

transition:0.3s;

}

.event:hover{

background:#00eaff;
color:black;
transform:scale(1.05);

}

/* popup */

.popup{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.8);

display:none;

justify-content:center;
align-items:center;

}

/* fiche */

.card{

width:700px;
height:400px;

background-size:cover;
background-position:center;

border-radius:10px;

box-shadow:0 0 30px #00eaff;

position:relative;

display:flex;
align-items:center;
justify-content:center;

}

/* texte */

.card-text{

background:rgba(0,0,0,0.7);

padding:20px;

border-radius:10px;

width:80%;

}

/* bouton fermer */

.close{

position:absolute;

top:10px;
right:15px;

font-size:25px;

cursor:pointer;

}

</style>

</head>

<body>

<h1>Événements Alphark</h1>

<div class="events">

<div class="event" onclick="openEvent('course','Course Dino','Course de dinos dans une arène. Le premier qui arrive gagne !')">COURSE DINO</div>

<div class="event" onclick="openEvent('glace','Palais des Glace','Labyrinthe glacé rempli de pièges.')">PALAIS DES GLACE</div>

<div class="event" onclick="openEvent('rallye','ARK Rallye','Course à travers la map avec checkpoints.')">ARK RALLYE</div>

<div class="event" onclick="openEvent('peche','Pêche','Concours de pêche, le plus gros poisson gagne.')">PECHE</div>

<div class="event" onclick="openEvent('gnome','Gnome','Trouver le gnome caché sur la map.')">GNOME</div>

<div class="event" onclick="openEvent('tresor','Chasse au trésor','Trouver les indices pour gagner le trésor.')">CHASSE AU TRESOR</div>

<div class="event" onclick="openEvent('quidditch','Coupe de Quidditch','Match inspiré de Harry Potter.')">COUPE DE QUIDDITCH</div>

<div class="event" onclick="openEvent('combat','Parcours du combattant','Parcours rempli d’obstacles.')">PARCOURS DU COMBATTANT</div>

<div class="event" onclick="openEvent('total','Total War','Combat général entre tribus.')">TOTAL WAR</div>

<div class="event" onclick="openEvent('duel','Jeux de l'ile','Défis dans une arène.')">JEUX DE L'ILE</div>

<div class="event" onclick="openEvent('tir','Tir à l'arc','Concours de précision.')">TIR A L'ARC</div>

</div>


<div class="popup" id="popup">

<div class="card" id="card">

<div class="close" onclick="closeEvent()">✖</div>

<div class="card-text">

<h2 id="title"></h2>

<p id="desc"></p>

</div>

</div>

</div>


<script>

function openEvent(img,title,desc){

document.getElementById("popup").style.display="flex"

document.getElementById("title").innerText=title

document.getElementById("desc").innerText=desc

document.getElementById("card").style.backgroundImage="url('../images/events/"+img+".jpg')"

}

function closeEvent(){

document.getElementById("popup").style.display="none"

}

</script>

</body>
</html>
