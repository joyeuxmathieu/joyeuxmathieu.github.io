<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphark</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="site">

<img src="background.jpg" class="bg">

<a href="pages/serveurgeneral.html" class="zone serveur"></a>
<a href="pages/evenements.html" class="zone events"></a>
<a href="pages/tribu.html" class="zone tribu"></a>
<a href="pages/joueurs.html" class="zone joueurs"></a>
<a href="pages/bot.html" class="zone bot"></a>
<a href="pages/mod.html" class="zone mod"></a>
<a href="pages/serveur.html" class="zone rejoindre"></a>
<a href="https://discord.gg/" class="zone discord"></a>

<div class="auth">

<button id="discord-btn">
Connexion Discord
</button>

<div id="user-info"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, OAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyCW2c98GzmqT0snVaKTRkm2KcZ4ndlBK7M",
authDomain: "alphark-f1982.firebaseapp.com",
projectId: "alphark-f1982"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const btn = document.getElementById("discord-btn");
const userInfo = document.getElementById("user-info");
.then((result)=>{

const credential = OAuthProvider.credentialFromResult(result);

const idToken = credential.idToken;

// décoder les infos Discord
const payload = JSON.parse(atob(idToken.split('.')[1]));

const username = payload.username;

userInfo.innerHTML = "🟢 " + username;

btn.style.display = "none";

localStorage.setItem("discord_user", JSON.stringify({
username: username
}));

})
btn.addEventListener("click", loginDiscord);

function loginDiscord(){

const provider = new OAuthProvider('oidc.discord');

signInWithPopup(auth, provider)
.then((result)=>{

const credential = OAuthProvider.credentialFromResult(result);

const idToken = credential.idToken;

// décoder les infos Discord
const payload = JSON.parse(atob(idToken.split('.')[1]));

const username = payload.username;

userInfo.innerHTML = "🟢 " + username;

btn.style.display = "none";

localStorage.setItem("discord_user", JSON.stringify({
username: username
}));

})

</script>

</body>
</html>
