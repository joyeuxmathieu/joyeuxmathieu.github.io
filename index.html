<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alphark</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="site">

<img src="background.jpg" class="bg">

<!-- MENU -->

<a href="pages/serveurgeneral.html" class="zone serveur"></a>
<a href="pages/evenements.html" class="zone events"></a>
<a href="pages/tribu.html" class="zone tribu"></a>
<a href="pages/joueurs.html" class="zone joueurs"></a>
<a href="pages/bot.html" class="zone bot"></a>
<a href="pages/mod.html" class="zone mod"></a>

<!-- BOUTON REJOINDRE -->

<a href="pages/serveur.html" class="zone rejoindre"></a>

<!-- DISCORD -->

<a href="https://discord.gg/" class="zone discord"></a>


<!-- CONNEXION DISCORD -->


<div class="auth">

<a href="https://discord.com/oauth2/authorize?client_id=1478681103228342384&response_type=token&redirect_uri=https%3A%2F%2Falphark.fr%2Fdiscord.html&scope=identify"
class="login-btn">

Connexion Discord

</a>

<div id="user-info"></div>

</div>

<!-- SCRIPT DISCORD -->

<script type="module" src="script.js"></script>
<script>

const user = localStorage.getItem("discord_user");

if(user){

const data = JSON.parse(user);

document.querySelector(".login-btn").style.display="none";

document.getElementById("user-info").innerHTML = `
<img src="${data.avatar}" class="avatar">
🟢 ${data.username}
<span onclick="logout()" style="cursor:pointer;color:red;">⏻</span>
`;

}

function logout(){
localStorage.removeItem("discord_user");
location.reload();
}

</script>
</body>
</html>
