<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alphark</title>

<link rel="stylesheet" href="style.css">


<!-- ========================================= -->
<!-- STYLE MENU JOUEURS CONNECTÉS -->
<!-- ========================================= -->

<style>

/* MENU */

#member-menu {

    position: fixed !important;

    top: 75px !important;
    right: 25px !important;

    left: auto !important;
    bottom: auto !important;

    width: 250px !important;

    z-index: 999999 !important;

    display: none;

}


/* BOUTON */

#online-button {

    display: block;

    width: 250px !important;

    box-sizing: border-box;

    padding: 12px 15px;

    color: white;

    background: linear-gradient(
        180deg,
        #174c82,
        #061426
    );

    border: 2px solid #00eaff;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 8px #00eaff,
        0 0 20px rgba(0,234,255,0.5);

    transition: 0.25s;

}


#online-button:hover {

    background: #00eaff;

    color: black;

    box-shadow:
        0 0 15px #00eaff,
        0 0 30px #00eaff;

}


/* LISTE */

#online-list {

    display: none;

    width: 230px !important;

    max-height: 350px;

    overflow-y: auto;

    margin-top: 8px;

    padding: 10px;

    box-sizing: border-box;

    background: rgba(2,10,25,0.97);

    border: 2px solid #00eaff;

    border-radius: 10px;

    box-shadow:
        0 0 12px #00eaff,
        0 0 25px rgba(0,234,255,0.5);

}


/* JOUEUR */

.online-player {

    display: flex !important;

    align-items: center;

    gap: 8px;

    width: 100%;

    box-sizing: border-box;

    padding: 8px;

    margin-bottom: 5px;

    color: white !important;

    background: rgba(10,35,65,0.85);

    border-radius: 6px;

    font-weight: bold;

}


/* AVATAR JOUEUR */

.online-avatar {

    width: 32px !important;

    height: 32px !important;

    min-width: 32px !important;

    max-width: 32px !important;

    border-radius: 50%;

    border: 2px solid #00ff6a;

    object-fit: cover;

}


/* UTILISATEUR CONNECTÉ */

.user-connected {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 6px;

}


/* MOBILE */

@media(max-width:900px) {

    #member-menu {

        top: 70px !important;

        right: 10px !important;

        width: 220px !important;

    }

    #online-button {

        width: 220px !important;

    }

    #online-list {

        width: 200px !important;

    }

}


/* ========================================= */
/* COMPTEUR JOUEURS CONNECTÉS */
/* ========================================= */

#online-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    margin-left: 7px;
    padding: 0 6px;
    color: white;
    background: #00aaff;
    border: 1px solid #00eaff;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    box-sizing: border-box;
}

</style>

</head>


<body>

<div class="site">


<img src="background.jpg" class="bg">


<!-- ======================= -->
<!-- MENU PRINCIPAL -->
<!-- ======================= -->

<a href="pages/serveurgeneral.html" class="zone serveur"></a>

<a href="pages/evenements.html" class="zone events"></a>

<a href="pages/tribu.html" class="zone tribu"></a>

<a href="pages/joueurs.html" class="zone joueurs"></a>

<a href="pages/bot.html" class="zone bot"></a>

<a href="pages/mod.html" class="zone mod"></a>


<!-- ======================= -->
<!-- BOUTON REJOINDRE -->
<!-- ======================= -->

<a href="pages/serveur.html" class="zone rejoindre"></a>


<!-- ======================= -->
<!-- DISCORD -->
<!-- ======================= -->

<a
    href="https://discord.gg/vANw6nyGM"
    class="zone discord">
</a>


<!-- ======================= -->
<!-- CONNEXION DISCORD -->
<!-- ======================= -->

<div class="auth">

    <a
        href="https://api.alphark.fr/auth/discord"
        class="discord-login"
        id="discord-login"
    >
        🔵 CONNEXION DISCORD
    </a>

    <div id="user-info"></div>

</div>


<!-- ======================= -->
<!-- JOUEURS CONNECTÉS -->
<!-- ======================= -->

<div id="member-menu">

    <button
        id="online-button"
        type="button"
    >
        👥 JOUEURS CONNECTÉS
        <span id="online-count">0</span>
    </button>

    <div id="online-list"></div>

</div>


<!-- ======================= -->
<!-- SCRIPT -->
<!-- ======================= -->

<script>

const API_URL = "https://api.alphark.fr";

let onlineTimer = null;


// ==========================================
// VÉRIFICATION CONNEXION
// ==========================================

async function checkDiscordConnection() {

    const loginButton =
        document.getElementById("discord-login");

    const userInfo =
        document.getElementById("user-info");

    const memberMenu =
        document.getElementById("member-menu");


    // Menu caché par défaut

    memberMenu.style.display = "none";


    try {

        const response = await fetch(
            API_URL + "/api/me",
            {
                credentials: "include"
            }
        );


        // ==================================
        // PAS CONNECTÉ
        // ==================================

        if (!response.ok) {

            loginButton.style.display =
                "inline-block";

            userInfo.innerHTML = "";

            return;

        }


        const data =
            await response.json();


        // ==================================
        // CONNECTÉ
        // ==================================

        if (
            data.loggedIn &&
            data.user
        ) {

            // Cacher bouton connexion

            loginButton.style.display =
                "none";


            // Afficher utilisateur

            userInfo.innerHTML = `

                <div class="user-connected">

                    <img
                        src="${data.user.avatar}"
                        class="avatar"
                        alt="Avatar Discord"
                    >

                    <span>
                        🟢 ${escapeHtml(data.user.username)}
                    </span>

                    <a
                        href="${API_URL}/auth/logout"
                        class="logout"
                        title="Déconnexion"
                    >
                        ⏻
                    </a>

                </div>

            `;


            // Afficher menu joueurs

            memberMenu.style.display =
                "block";


            // Enregistrer présence

            await updatePresence();


            // Charger joueurs

            await loadOnlinePlayers();


            // Actualisation toutes les 60 secondes

            if (!onlineTimer) {

                onlineTimer = setInterval(
                    async () => {

                        await updatePresence();

                        await loadOnlinePlayers();

                    },
                    60000
                );

            }

        }

    }

    catch (error) {

        console.error(
            "❌ Erreur API ALPHARK :",
            error
        );

    }

}


// ==========================================
// PRÉSENCE
// ==========================================

async function updatePresence() {

    try {

        await fetch(
            API_URL + "/api/presence",
            {
                method: "POST",

                credentials: "include",

                headers: {
                    "Content-Type":
                        "application/json"
                }
            }
        );

    }

    catch (error) {

        console.error(
            "❌ Erreur présence :",
            error
        );

    }

}


// ==========================================
// CHARGER JOUEURS CONNECTÉS
// ==========================================

async function loadOnlinePlayers() {

    const list =
        document.getElementById("online-list");

    const count =
        document.getElementById("online-count");

    try {

        const response = await fetch(
            API_URL + "/api/online",
            {
                credentials: "include",
                cache: "no-store"
            }
        );

        if (!response.ok) {

            if (count) {
                count.textContent = "0";
            }

            list.innerHTML =
                "<p>Impossible de charger les joueurs.</p>";

            return;
        }

        const data =
            await response.json();

        if (
            !data.loggedIn ||
            !Array.isArray(data.players)
        ) {

            if (count) {
                count.textContent = "0";
            }

            list.innerHTML =
                "<p>Connexion requise.</p>";

            return;
        }

        // Mettre à jour le compteur
        if (count) {
            count.textContent =
                data.players.length;
        }

        // Aucun joueur
        if (data.players.length === 0) {

            list.innerHTML =
                "<p>🟢 Aucun joueur connecté.</p>";

            return;
        }

        // Affichage
        list.innerHTML = "";

        data.players.forEach(player => {

            const playerElement =
                document.createElement("div");

            playerElement.className =
                "online-player";

            playerElement.innerHTML = `

                <img
                    src="${player.avatar}"
                    class="online-avatar"
                    alt=""
                >

                <span>
                    🟢 ${escapeHtml(player.username)}
                </span>

            `;

            list.appendChild(
                playerElement
            );

        });

    }

    catch (error) {

        if (count) {
            count.textContent = "0";
        }

        console.error(
            "❌ Erreur joueurs connectés :",
            error
        );

    }

}


// ==========================================
// PROTECTION HTML
// ==========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ==========================================
// BOUTON JOUEURS
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const button =
            document.getElementById("online-button");

        const list =
            document.getElementById("online-list");


        button.addEventListener(
            "click",
            () => {

                if (
                    list.style.display === "block"
                ) {

                    list.style.display =
                        "none";

                }

                else {

                    list.style.display =
                        "block";

                    loadOnlinePlayers();

                }

            }
        );

    }
);


// ==========================================
// DÉMARRAGE
// ==========================================

checkDiscordConnection();

</script>


</div>

</body>

</html>
