<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alphark</title>

<link rel="stylesheet" href="style.css">


<!-- ========================================= -->
<!-- STYLE MENU JOUEURS CONNECTÉS -->
<!-- ========================================= -->

<style>

/* MENU */

#member-menu {

    position: fixed !important;

    top: 75px !important;
    right: 25px !important;

    left: auto !important;
    bottom: auto !important;

    width: 250px !important;

    z-index: 999999 !important;

    display: none;

}


/* BOUTON */

#online-button {

    display: block;

    width: 250px !important;

    box-sizing: border-box;

    padding: 12px 15px;

    color: white;

    background: linear-gradient(
        180deg,
        #174c82,
        #061426
    );

    border: 2px solid #00eaff;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 8px #00eaff,
        0 0 20px rgba(0,234,255,0.5);

    transition: 0.25s;

}


#online-button:hover {

    background: #00eaff;

    color: black;

    box-shadow:
        0 0 15px #00eaff,
        0 0 30px #00eaff;

}


/* LISTE */

#online-list {

    display: none;

    width: 230px !important;

    max-height: 350px;

    overflow-y: auto;

    margin-top: 8px;

    padding: 10px;

    box-sizing: border-box;

    background: rgba(2,10,25,0.97);

    border: 2px solid #00eaff;

    border-radius: 10px;

    box-shadow:
        0 0 12px #00eaff,
        0 0 25px rgba(0,234,255,0.5);

}


/* JOUEUR */

.online-player {

    display: flex !important;

    align-items: center;

    gap: 8px;

    width: 100%;

    box-sizing: border-box;

    padding: 8px;

    margin-bottom: 5px;

    color: white !important;

    background: rgba(10,35,65,0.85);

    border-radius: 6px;

    font-weight: bold;

}


/* AVATAR JOUEUR */

.online-avatar {

    width: 32px !important;

    height: 32px !important;

    min-width: 32px !important;

    max-width: 32px !important;

    border-radius: 50%;

    border: 2px solid #00ff6a;

    object-fit: cover;

}


/* UTILISATEUR CONNECTÉ */

.user-connected {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 6px;

}


/* MOBILE */

@media(max-width:900px) {

    #member-menu {

        top: 70px !important;

        right: 10px !important;

        width: 220px !important;

    }

    #online-button {

        width: 220px !important;

    }

    #online-list {

        width: 200px !important;

    }

}


/* ========================================= */
/* COMPTEUR JOUEURS CONNECTÉS */
/* ========================================= */

#online-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    margin-left: 7px;
    padding: 0 6px;
    color: white;
    background: #00aaff;
    border: 1px solid #00eaff;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    box-sizing: border-box;
}


/* MENU MAPS */
#maps-menu{position:fixed!important;top:125px!important;right:25px!important;width:250px!important;z-index:999998!important;display:none}
#maps-button{display:block;width:250px!important;box-sizing:border-box;padding:12px 15px;color:white;background:linear-gradient(180deg,#174c82,#061426);border:2px solid #00eaff;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 0 8px #00eaff,0 0 20px rgba(0,234,255,.5)}
#maps-button:hover{background:#00eaff;color:#000}
#maps-list{display:none;width:250px!important;max-height:430px;overflow-y:auto;margin-top:8px;padding:10px;box-sizing:border-box;background:rgba(2,10,25,.97);border:2px solid #00eaff;border-radius:10px;box-shadow:0 0 12px #00eaff,0 0 25px rgba(0,234,255,.5)}
.map-server{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;margin-bottom:6px;color:white;background:rgba(10,35,65,.85);border-radius:6px;font-weight:bold}
.map-name{flex:1;min-width:0}.map-status{white-space:nowrap;font-size:12px}.map-online{color:#00ff6a}.map-offline{color:#ff3b3b}.map-loading,.map-error{color:white;text-align:center;padding:8px;margin:0}
#maps-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;margin-left:7px;padding:0 6px;color:white;background:#00aaff;border:1px solid #00eaff;border-radius:50%;font-size:12px;font-weight:bold;box-sizing:border-box}
@media(max-width:900px){#maps-menu{top:120px!important;right:10px!important;width:220px!important}#maps-button,#maps-list{width:220px!important}}


/* ========================================= */
/* CONNEXION ALPHARK PAR CODE */
/* ========================================= */

.discord-login {
    border: 0;
    font-family: inherit;
    appearance: none;
    cursor: pointer;
}

#login-code-modal {
    position: fixed;
    inset: 0;
    z-index: 1000000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0,0,0,0.80);
}

#login-code-box {
    width: min(430px, 100%);
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
    color: white;
    background: linear-gradient(180deg, rgba(20,50,85,0.98), rgba(3,13,27,0.99));
    border: 2px solid #00eaff;
    border-radius: 12px;
    box-shadow: 0 0 15px #00eaff, 0 0 40px rgba(0,234,255,0.45);
}

#login-code-box h2 { margin: 0 0 10px; font-size: 22px; }
#login-code-box p { margin: 8px 0; line-height: 1.45; }

#login-code {
    margin: 18px 0;
    padding: 12px 18px;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 6px;
    color: #00ffea;
    background: rgba(0,0,0,0.35);
    border: 2px solid #00eaff;
    border-radius: 8px;
}

#login-code-status { min-height: 24px; margin: 12px 0; color: #dffcff; }

#login-code-close {
    margin-top: 8px;
    padding: 9px 18px;
    color: white;
    background: #193550;
    border: 1px solid #00eaff;
    border-radius: 7px;
    cursor: pointer;
}

#login-code-close:hover { background: #00eaff; color: black; }

</style>

</head>


<body>

<div class="site">


<img src="background.jpg" class="bg">


<!-- ======================= -->
<!-- MENU PRINCIPAL -->
<!-- ======================= -->

<a href="pages/serveurgeneral.html" class="zone serveur"></a>

<a href="pages/evenements.html" class="zone events"></a>

<a href="pages/tribu.html" class="zone tribu"></a>

<a href="pages/joueurs.html" class="zone joueurs"></a>

<a href="pages/bot.html" class="zone bot"></a>

<a href="pages/mod.html" class="zone mod"></a>


<!-- ======================= -->
<!-- BOUTON REJOINDRE -->
<!-- ======================= -->

<a href="pages/serveur.html" class="zone rejoindre"></a>


<!-- ======================= -->
<!-- DISCORD -->
<!-- ======================= -->

<a
    href="https://discord.gg/vANw6nyGM"
    class="zone discord">
</a>


<!-- ======================= -->
<!-- CONNEXION DISCORD -->
<!-- ======================= -->

<div class="auth">

    <button
        type="button"
        class="discord-login"
        id="discord-login"
    >
        🔐 CONNEXION ALPHARK
    </button>

    <div id="user-info"></div>

</div>


<!-- ======================= -->
<!-- CONNEXION ALPHARK PAR CODE -->
<!-- ======================= -->

<div id="login-code-modal">
    <div id="login-code-box">
        <h2>🔐 CONNEXION ALPHARK</h2>
        <p>Ton code de connexion est :</p>
        <div id="login-code">------</div>
        <p>Dans Discord, sur le serveur <strong>ALPHARK</strong>, tape :</p>
        <p><strong>*connexion <span id="login-code-command">------</span></strong></p>
        <div id="login-code-status">⏳ En attente de validation...</div>
        <button type="button" id="login-code-close">Fermer</button>
    </div>
</div>


<!-- ======================= -->
<!-- JOUEURS CONNECTÉS -->
<!-- ======================= -->

<div id="member-menu">

    <button
        id="online-button"
        type="button"
    >
        👥 JOUEURS CONNECTÉS
        <span id="online-count">0</span>
    </button>

    <div id="online-list"></div>

</div>

<!-- ======================= -->
<!-- MAPS / SERVEURS ARK -->
<!-- ======================= -->

<div id="maps-menu">
    <button id="maps-button" type="button">
        🗺️ MAPS
        <span id="maps-count">0</span>
    </button>
    <div id="maps-list">
        <p class="map-loading">⏳ Chargement des serveurs...</p>
    </div>
</div>


<!-- ======================= -->
<!-- SCRIPT -->
<!-- ======================= -->

<script>

const API_URL = "https://api.alphark.fr";

let onlineTimer = null;


let loginCodeTimer = null;
let loginCodeBusy = false;

async function startSiteLogin() {
    if (loginCodeBusy) return;

    const modal = document.getElementById("login-code-modal");
    const codeElement = document.getElementById("login-code");
    const commandElement = document.getElementById("login-code-command");
    const statusElement = document.getElementById("login-code-status");

    loginCodeBusy = true;
    modal.style.display = "flex";
    codeElement.textContent = "......";
    commandElement.textContent = "......";
    statusElement.textContent = "⏳ Génération du code...";

    if (loginCodeTimer) {
        clearInterval(loginCodeTimer);
        loginCodeTimer = null;
    }

    try {
        const response = await fetch(API_URL + "/auth/code/start", {
            credentials: "include",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.success || !data.code) {
            throw new Error("Aucun code reçu.");
        }

        codeElement.textContent = data.code;
        commandElement.textContent = data.code;
        statusElement.textContent =
            "⏳ En attente de validation dans Discord...";

        loginCodeTimer = setInterval(
            checkSiteLoginStatus,
            2000
        );

    } catch (error) {
        console.error("❌ Connexion ALPHARK :", error);
        statusElement.textContent =
            "❌ Impossible de générer le code.";
    } finally {
        loginCodeBusy = false;
    }
}

async function checkSiteLoginStatus() {
    try {
        const response = await fetch(
            API_URL + "/auth/code/status",
            {
                credentials: "include",
                cache: "no-store"
            }
        );

        if (!response.ok) return;

        const data = await response.json();
        const statusElement =
            document.getElementById("login-code-status");

        if (data.status === "connected" && data.loggedIn) {
            if (loginCodeTimer) {
                clearInterval(loginCodeTimer);
                loginCodeTimer = null;
            }

            statusElement.textContent =
                "✅ Connexion réussie !";

            setTimeout(() => {
                closeSiteLoginModal();
                checkDiscordConnection();
            }, 700);

            return;
        }

        if (data.status === "expired") {
            if (loginCodeTimer) {
                clearInterval(loginCodeTimer);
                loginCodeTimer = null;
            }

            statusElement.textContent =
                "❌ Le code a expiré.";
            return;
        }

        if (data.status === "verified") {
            statusElement.textContent =
                "✅ Code validé par le Bot Starter...";
            return;
        }

        statusElement.textContent =
            "⏳ En attente de validation dans Discord...";

    } catch (error) {
        console.error(
            "❌ Erreur statut connexion :",
            error
        );
    }
}

function closeSiteLoginModal() {
    if (loginCodeTimer) {
        clearInterval(loginCodeTimer);
        loginCodeTimer = null;
    }

    const modal =
        document.getElementById("login-code-modal");

    if (modal) {
        modal.style.display = "none";
    }
}



// ==========================================
// VÉRIFICATION CONNEXION
// ==========================================

async function checkDiscordConnection() {

    const loginButton =
        document.getElementById("discord-login");

    const userInfo =
        document.getElementById("user-info");

    const memberMenu =
        document.getElementById("member-menu");


    // Menu caché par défaut

    memberMenu.style.display = "none";


    try {

        const response = await fetch(
            API_URL + "/api/me",
            {
                credentials: "include"
            }
        );


        // ==================================
        // PAS CONNECTÉ
        // ==================================

        if (!response.ok) {

            loginButton.style.display =
                "inline-block";

            userInfo.innerHTML = "";

            return;

        }


        const data =
            await response.json();


        // ==================================
        // CONNECTÉ
        // ==================================

        if (
            data.loggedIn &&
            data.user
        ) {

            // Cacher bouton connexion

            loginButton.style.display =
                "none";


            // Afficher utilisateur

            userInfo.innerHTML = `

                <div class="user-connected">

                    <img
                        src="${data.user.avatar}"
                        class="avatar"
                        alt="Avatar Discord"
                    >

                    <span>
                        🟢 ${escapeHtml(data.user.username)}
                    </span>

                    <a
                        href="${API_URL}/auth/logout"
                        class="logout"
                        title="Déconnexion"
                    >
                        ⏻
                    </a>

                </div>

            `;


            // Afficher menus membres + maps

            memberMenu.style.display =
                "block";

            const mapsMenu =
                document.getElementById("maps-menu");

            if (mapsMenu) {
                mapsMenu.style.display = "block";
            }

            await loadArkServers();


            // Enregistrer présence

            await updatePresence();


            // Charger joueurs

            await loadOnlinePlayers();


            // Actualisation toutes les 60 secondes

            if (!onlineTimer) {

                onlineTimer = setInterval(
                    async () => {

                        await updatePresence();

                        await loadOnlinePlayers();

                    },
                    60000
                );

            }

        }

    }

    catch (error) {

        console.error(
            "❌ Erreur API ALPHARK :",
            error
        );

    }

}


// ==========================================
// PRÉSENCE
// ==========================================

async function updatePresence() {

    try {

        await fetch(
            API_URL + "/api/presence",
            {
                method: "POST",

                credentials: "include",

                headers: {
                    "Content-Type":
                        "application/json"
                }
            }
        );

    }

    catch (error) {

        console.error(
            "❌ Erreur présence :",
            error
        );

    }

}


// ==========================================
// CHARGER JOUEURS CONNECTÉS
// ==========================================

async function loadOnlinePlayers() {

    const list =
        document.getElementById("online-list");

    const count =
        document.getElementById("online-count");

    try {

        const response = await fetch(
            API_URL + "/api/online",
            {
                credentials: "include",
                cache: "no-store"
            }
        );

        if (!response.ok) {

            if (count) {
                count.textContent = "0";
            }

            list.innerHTML =
                "<p>Impossible de charger les joueurs.</p>";

            return;
        }

        const data =
            await response.json();

        if (
            !data.loggedIn ||
            !Array.isArray(data.players)
        ) {

            if (count) {
                count.textContent = "0";
            }

            list.innerHTML =
                "<p>Connexion requise.</p>";

            return;
        }

        // Mettre à jour le compteur
        if (count) {
            count.textContent =
                data.players.length;
        }

        // Aucun joueur
        if (data.players.length === 0) {

            list.innerHTML =
                "<p>🟢 Aucun joueur connecté.</p>";

            return;
        }

        // Affichage
        list.innerHTML = "";

        data.players.forEach(player => {

            const playerElement =
                document.createElement("div");

            playerElement.className =
                "online-player";

            playerElement.innerHTML = `

                <img
                    src="${player.avatar}"
                    class="online-avatar"
                    alt=""
                >

                <span>
                    🟢 ${escapeHtml(player.username)}
                </span>

            `;

            list.appendChild(
                playerElement
            );

        });

    }

    catch (error) {

        if (count) {
            count.textContent = "0";
        }

        console.error(
            "❌ Erreur joueurs connectés :",
            error
        );

    }

}


// ==========================================
// SERVEURS ARK / MAPS
// ==========================================

async function loadArkServers() {
    const list = document.getElementById("maps-list");
    const count = document.getElementById("maps-count");
    if (!list) return;

    try {
        const response = await fetch(API_URL + "/api/servers", {
            credentials: "include",
            cache: "no-store"
        });

        if (!response.ok) {
            if (count) count.textContent = "0";
            list.innerHTML = "<p class=\"map-error\">🔴 Statut des serveurs indisponible.</p>";
            return;
        }

        const data = await response.json();

        if (!Array.isArray(data.servers)) {
            if (count) count.textContent = "0";
            list.innerHTML = "<p class=\"map-error\">⚠️ Aucune donnée serveur.</p>";
            return;
        }

        const onlineCount = data.servers.filter(server => server.online === true).length;
        if (count) count.textContent = onlineCount;

        list.innerHTML = "";

        if (data.servers.length === 0) {
            list.innerHTML = "<p class=\"map-error\">🔴 Aucun serveur configuré.</p>";
            return;
        }

        data.servers.forEach(server => {
            const element = document.createElement("div");
            element.className = "map-server";

            const online = server.online === true;
            const players = Number.isFinite(server.players) ? server.players : 0;
            const maxPlayers = Number.isFinite(server.maxPlayers) ? server.maxPlayers : 70;

            element.innerHTML = `
                <span class="map-name">${escapeHtml(server.name || "Map")}</span>
                <span class="map-status ${online ? "map-online" : "map-offline"}">
                    ${online ? "🟢 " + players + "/" + maxPlayers : "🔴 HORS LIGNE"}
                </span>
            `;

            list.appendChild(element);
        });

    } catch (error) {
        if (count) count.textContent = "0";
        list.innerHTML = "<p class=\"map-error\">⚠️ API serveur inaccessible.</p>";
        console.error("❌ Erreur statut ARK :", error);
    }
}


// ==========================================
// PROTECTION HTML
// ==========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ==========================================
// BOUTON JOUEURS
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const loginButton =
            document.getElementById("discord-login");

        const loginClose =
            document.getElementById("login-code-close");

        const loginModal =
            document.getElementById("login-code-modal");

        if (loginButton) {
            loginButton.addEventListener(
                "click",
                startSiteLogin
            );
        }

        if (loginClose) {
            loginClose.addEventListener(
                "click",
                closeSiteLoginModal
            );
        }

        if (loginModal) {
            loginModal.addEventListener(
                "click",
                (event) => {
                    if (event.target === loginModal) {
                        closeSiteLoginModal();
                    }
                }
            );
        }


        const button =
            document.getElementById("online-button");

        const list =
            document.getElementById("online-list");

        if (button && list) {
            button.addEventListener(
                "click",
                () => {
                    if (list.style.display === "block") {
                        list.style.display = "none";
                    } else {
                        list.style.display = "block";
                        loadOnlinePlayers();
                    }
                }
            );
        }

        const mapsButton =
            document.getElementById("maps-button");

        const mapsList =
            document.getElementById("maps-list");

        if (mapsButton && mapsList) {
            mapsButton.addEventListener(
                "click",
                () => {
                    if (mapsList.style.display === "block") {
                        mapsList.style.display = "none";
                    } else {
                        mapsList.style.display = "block";
                        loadArkServers();
                    }
                }
            );
        }
    }
);


// ==========================================
// DÉMARRAGE
// ==========================================

checkDiscordConnection();

</script>


</div>

</body>
