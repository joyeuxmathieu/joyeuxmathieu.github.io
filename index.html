<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alphark</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="site">

<img src="background.jpg" class="bg">


<!-- ======================= -->
<!-- MENU PRINCIPAL -->
<!-- ======================= -->

<a href="pages/serveurgeneral.html" class="zone serveur"></a>

<a href="pages/evenements.html" class="zone events"></a>

<a href="pages/tribu.html" class="zone tribu"></a>

<a href="pages/joueurs.html" class="zone joueurs"></a>

<a href="pages/bot.html" class="zone bot"></a>

<a href="pages/mod.html" class="zone mod"></a>


<!-- ======================= -->
<!-- BOUTON REJOINDRE -->
<!-- ======================= -->

<a href="pages/serveur.html" class="zone rejoindre"></a>


<!-- ======================= -->
<!-- DISCORD -->
<!-- ======================= -->

<a href="https://discord.gg/vANw6nyGM" class="zone discord"></a>


<!-- ======================= -->
<!-- CONNEXION DISCORD -->
<!-- ======================= -->

<div class="auth">

    <a
        href="https://api.alphark.fr/auth/discord"
        class="discord-login"
        id="discord-login"
    >
        🔵 CONNEXION DISCORD
    </a>

    <div id="user-info"></div>

</div>


<!-- ======================= -->
<!-- MENU JOUEUR CONNECTÉ -->
<!-- ======================= -->

<div
    id="member-menu"
    class="member-menu"
>

    <button
        id="online-button"
        class="online-button"
    >
        👥 JOUEURS CONNECTÉS
    </button>

    <div
        id="online-list"
        class="online-list"
    ></div>

</div>


<!-- ======================= -->
<!-- SCRIPT -->
<!-- ======================= -->

<script>

const API_URL = "https://api.alphark.fr";

let onlineTimer = null;


// ==========================================
// VÉRIFICATION DE LA CONNEXION
// ==========================================

async function checkDiscordConnection() {

    const loginButton =
        document.getElementById("discord-login");

    const userInfo =
        document.getElementById("user-info");

    const memberMenu =
        document.getElementById("member-menu");


    // Caché par défaut
    memberMenu.style.display = "none";


    try {

        const response = await fetch(
            API_URL + "/api/me",
            {
                credentials: "include"
            }
        );


        // ==============================
        // PAS CONNECTÉ
        // ==============================

        if (!response.ok) {

            loginButton.style.display = "inline-block";

            userInfo.innerHTML = "";

            return;
        }


        const data =
            await response.json();


        // ==============================
        // CONNECTÉ
        // ==============================

        if (data.loggedIn && data.user) {

            // Cacher connexion
            loginButton.style.display = "none";


            // Afficher utilisateur
            userInfo.innerHTML = `

                <div class="user-connected">

                    <img
                        src="${data.user.avatar}"
                        class="avatar"
                        alt="Avatar Discord"
                    >

                    <span>
                        🟢 ${data.user.username}
                    </span>

                    <a
                        href="${API_URL}/auth/logout"
                        class="logout"
                        title="Déconnexion"
                    >
                        ⏻
                    </a>

                </div>

            `;


            // Afficher menu membre
            memberMenu.style.display = "block";


            // Enregistrer présence
            await updatePresence();


            // Charger les joueurs
            await loadOnlinePlayers();


            // Actualiser toutes les 60 secondes
            if (!onlineTimer) {

                onlineTimer = setInterval(
                    async () => {

                        await updatePresence();
                        await loadOnlinePlayers();

                    },
                    60000
                );

            }

        }

    }

    catch (error) {

        console.error(
            "❌ Erreur API ALPHARK :",
            error
        );

    }

}


// ==========================================
// ENREGISTRER NOTRE PRÉSENCE
// ==========================================

async function updatePresence() {

    try {

        await fetch(
            API_URL + "/api/presence",
            {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                }
            }
        );

    }

    catch (error) {

        console.error(
            "❌ Erreur présence :",
            error
        );

    }

}


// ==========================================
// CHARGER LES JOUEURS CONNECTÉS
// ==========================================

async function loadOnlinePlayers() {

    const list =
        document.getElementById("online-list");


    try {

        const response = await fetch(
            API_URL + "/api/online",
            {
                credentials: "include"
            }
        );


        if (!response.ok) {

            list.innerHTML =
                "<p>Impossible de charger les joueurs.</p>";

            return;
        }


        const data =
            await response.json();


        if (
            !data.loggedIn ||
            !data.players
        ) {

            list.innerHTML =
                "<p>Connexion requise.</p>";

            return;
        }


        // ==============================
        // AUCUN JOUEUR
        // ==============================

        if (data.players.length === 0) {

            list.innerHTML =
                "<p>🟢 Aucun joueur connecté.</p>";

            return;
        }


        // ==============================
        // AFFICHAGE
        // ==============================

        list.innerHTML = "";

        data.players.forEach(player => {

            const playerElement =
                document.createElement("div");

            playerElement.className =
                "online-player";


            playerElement.innerHTML = `

                <img
                    src="${player.avatar}"
                    class="online-avatar"
                    alt=""
                >

                <span>
                    🟢 ${escapeHtml(player.username)}
                </span>

            `;


            list.appendChild(
                playerElement
            );

        });

    }

    catch (error) {

        console.error(
            "❌ Erreur joueurs connectés :",
            error
        );

    }

}


// ==========================================
// PROTECTION AFFICHAGE PSEUDO
// ==========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ==========================================
// BOUTON JOUEURS CONNECTÉS
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const button =
            document.getElementById("online-button");

        const list =
            document.getElementById("online-list");


        button.addEventListener(
            "click",
            () => {

                if (
                    list.style.display === "block"
                ) {

                    list.style.display =
                        "none";

                }

                else {

                    list.style.display =
                        "block";

                    loadOnlinePlayers();

                }

            }
        );

    }
);


// ==========================================
// LANCEMENT
// ==========================================

checkDiscordConnection();

</script>


</div>

</body>

</html>
